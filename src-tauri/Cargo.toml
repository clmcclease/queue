[package]
name = "queue"
version = "0.1.0"
description = "Desktop queue for yt-dlp downloads with clean file names"
authors = ["Chris McClease"]
license = "MIT OR Apache-2.0"
publish = false
rust-version = "1.99.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "queue_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
tauri = { version = "=2.12.2", features = [] }
serde = { version = "=1.0.229", features = ["derive"] }
url = "=2.5.8"
serde_json = "=1.0.151"
tauri-plugin-dialog = "=2.8.1"
tauri-plugin-single-instance = "=2.5.1"
# One blocking HTTP client for naming providers, the local model server and the model download
# (D-029); rustls, so there's no OpenSSL on Linux.
ureq = { version = "=3.4.2", default-features = false, features = ["rustls", "json"] }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.190"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_Shell_Common"] }

# Only Linux and the BSDs reveal through the opener plugin (FileManager1 over D-Bus); macOS and
# Windows use Queue's own launchers in reveal.rs (D-022).
[target.'cfg(not(any(target_os = "macos", windows)))'.dependencies]
tauri-plugin-opener = "=2.7.0"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
# Unwind (not the template's "abort"): the metadata worker recovers from a panic in one job.
panic = "unwind"
strip = true
