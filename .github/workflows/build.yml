# Cross-platform build (#29, #41). The full checks and tests run natively on Linux, Windows and
# macOS (arm64) for every PR and every push to main (D-023). Pushes to main (and PRs labelled
# ci:bundle) also bundle for each OS and upload unsigned artifacts. macOS minutes bill at 10x,
# so plain PRs skip bundling. Signing is #24.
# Sidecars (#2, D-012): ffmpeg/ffprobe are built from source once per target (cached by script and
# manifest hash); each job then downloads them and fetches the pinned yt-dlp and deno.
name: build

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

permissions:
  contents: read

# PR runs share a group so a new push cancels the stale run. Every other run gets its own
# group: GitHub keeps only one pending run per group, so main pushes would otherwise drop builds.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  ffmpeg:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            targets: aarch64-apple-darwin x86_64-apple-darwin
            key: macos
          - runner: ubuntu-24.04
            targets: x86_64-unknown-linux-gnu x86_64-pc-windows-msvc
            key: linux-windows
    name: ffmpeg (${{ matrix.key }})
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
      - id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: src-tauri/binaries/queue-ff*
          key: ffmpeg-${{ matrix.key }}-${{ hashFiles('scripts/build-ffmpeg.sh', 'scripts/sidecars.json') }}
      - name: Install mingw-w64 and zlib
        if: steps.cache.outputs.cache-hit != 'true' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 libz-mingw-w64-dev zlib1g-dev
      - name: Build ffmpeg + ffprobe
        if: steps.cache.outputs.cache-hit != 'true'
        run: for t in ${{ matrix.targets }}; do scripts/build-ffmpeg.sh "$t"; done
      - name: Split per target
        run: for t in ${{ matrix.targets }}; do mkdir -p "out/$t" && cp src-tauri/binaries/queue-ff*-"$t"* "out/$t/"; done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ffmpeg-${{ matrix.key }}
          path: out/

  # The same checks on each OS, so OS-specific behavior (paths, process trees, file managers,
  # filesystem case and Unicode rules) is tested where it runs. One OS failing doesn't hide the others.
  test:
    needs: ffmpeg
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: windows
            runner: windows-2025
            target: x86_64-pc-windows-msvc
          - os: macos
            runner: macos-26
            target: aarch64-apple-darwin
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: npm
      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ffmpeg-*
          merge-multiple: true
          path: ffmpeg-out
      - name: Install sidecars and check yt-dlp sees them
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          cp ffmpeg-out/${{ matrix.target }}/* src-tauri/binaries/
          chmod +x src-tauri/binaries/queue-*
          node scripts/fetch-sidecars.mjs --target ${{ matrix.target }} --check
      - name: Install Rust (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target
          key: test-${{ matrix.os }}
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: cargo fmt --check
        working-directory: src-tauri
      - run: cargo clippy --locked --all-targets -- -D warnings
        working-directory: src-tauri
      - run: cargo test --locked
        working-directory: src-tauri

  # The same checks on the owner's Linux box (self-hosted runner, labels self-hosted/linux/ryzen),
  # for heavier tests and real hardware. Opt-in (manual run, or a PR labelled ci:box) so an offline
  # box never leaves checks pending, and never for fork PRs: a self-hosted runner executes the
  # repo's code. The box has the Tauri build packages installed, so there's no apt step.
  test-box:
    needs: ffmpeg
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       contains(github.event.pull_request.labels.*.name, 'ci:box'))
    runs-on: [self-hosted, linux, ryzen]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ffmpeg-*
          merge-multiple: true
          path: ffmpeg-out
      - name: Install sidecars and check yt-dlp sees them
        run: |
          mkdir -p src-tauri/binaries
          cp ffmpeg-out/x86_64-unknown-linux-gnu/* src-tauri/binaries/
          chmod +x src-tauri/binaries/queue-*
          node scripts/fetch-sidecars.mjs --target x86_64-unknown-linux-gnu --check
      - name: Install Rust (rust-toolchain.toml)
        run: rustup toolchain install
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: cargo fmt --check
        working-directory: src-tauri
      - run: cargo clippy --locked --all-targets -- -D warnings
        working-directory: src-tauri
      - run: cargo test --locked
        working-directory: src-tauri

  bundle:
    needs: test
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:bundle')
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            runner: macos-26
            target: aarch64-apple-darwin
          - name: macos-x64
            runner: macos-26
            target: x86_64-apple-darwin
          - name: windows-x64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
          - name: linux-x64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    name: bundle (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: npm
      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Install Rust (rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ffmpeg-*
          merge-multiple: true
          path: ffmpeg-out
      # Runs each sidecar on its own OS (macOS x64 via Rosetta) to prove yt-dlp finds them.
      - name: Install sidecars and check yt-dlp sees them
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          cp ffmpeg-out/${{ matrix.target }}/* src-tauri/binaries/
          chmod +x src-tauri/binaries/queue-*
          node scripts/fetch-sidecars.mjs --target ${{ matrix.target }} --check
      - run: npm ci
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        with:
          args: --target ${{ matrix.target }}
          uploadWorkflowArtifacts: true
      # Also covers macOS x64 (Rosetta), which has no test job of its own.
      - run: npm test
